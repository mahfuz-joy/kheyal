    const DB_NAME = 'ModernNotesDB';
    const DB_VERSION = 4;
    const STORE_NAME = 'notes';
    const FALLBACK_KEY = 'modern_notes_fallback_data_v4';
    const LABELS_KEY = 'notes_app_custom_labels';
    const ON_THIS_DAY_KEY = 'notes_show_on_this_day';

    // Top-Level Error Boundary
    class AppErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Kheyal App Boundary Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-white">
              <div className="max-w-md w-full p-6 rounded-3xl bg-white dark:bg-neutral-800 shadow-2xl border border-red-200 dark:border-red-900 text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 flex items-center justify-center mx-auto text-xl font-bold">⚠️</div>
                <h2 className="text-base font-bold">Something went wrong</h2>
                <p className="text-xs text-neutral-500 dark:text-neutral-400">Your notes are safely preserved. Click below to reload.</p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs shadow-md transition"
                >
                  Reload Application
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB not supported'));
        try {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('createdAt', 'createdAt', { unique: false });
              store.createIndex('updatedAt', 'updatedAt', { unique: false });
              store.createIndex('reminder', 'reminder', { unique: false });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        } catch (e) {
          reject(e);
        }
      });
    }

    function syncToFallback(notes) {
      try {
        const serialized = notes.map(n => {
          const c = { ...n };
          delete c.audioBlob;
          return c;
        });
        localStorage.setItem(FALLBACK_KEY, JSON.stringify(serialized));
      } catch (e) {}
    }

    function getFallbackNotes() {
      try {
        const raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    async function dbGetAllNotes() {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => {
            const result = request.result || [];
            syncToFallback(result);
            resolve(result);
          };
          request.onerror = () => resolve(getFallbackNotes());
        });
      } catch (e) {
        return getFallbackNotes();
      }
    }

    async function dbSaveNote(note) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.put(note);
          tx.oncomplete = () => resolve(note);
          tx.onerror = () => resolve(note);
        });
      } catch (e) {
        return note;
      }
    }

    async function dbDeleteNotePermanently(id) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch (e) {}
    }

    async function blobToBase64(blob) {
      if (!blob) return null;
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function base64ToBlob(base64Data) {
      if (!base64Data) return null;
      try {
        const res = await fetch(base64Data);
        return await res.blob();
      } catch (e) {
        return null;
      }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return '00:00';
      const minutes = Math.floor(sec / 60);
      const seconds = Math.floor(sec % 60);
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function formatReminderDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return '';
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (isToday) return `Today, ${timeStr}`;
      return `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${timeStr}`;
    }

    // Compares two version strings like "1.2.0" vs "1.10.0" numerically, part by part,
    // instead of a plain string match which breaks on things like "1.2" vs "1.2.0".
    function compareVersions(v1, v2) {
      if (!v1 || !v2) return 0;
      const parse = (v) => String(v).replace(/^v/i, '').trim().split(/[.\-+]/).map((x) => parseInt(x, 10) || 0);
      const p1 = parse(v1);
      const p2 = parse(v2);
      const max = Math.max(p1.length, p2.length);
      for (let i = 0; i < max; i++) {
        const a = p1[i] || 0;
        const b = p2[i] || 0;
        if (a > b) return 1;
        if (a < b) return -1;
      }
      return 0;
    }

    // Live Waveform Visualizer for real-time microphone analysis
    function LiveWaveformVisualizer({ analyser, isRecording, isPaused }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        const bufferLength = analyser ? analyser.frequencyBinCount : 64;
        const dataArray = new Uint8Array(bufferLength);

        const renderWave = () => {
          animId = requestAnimationFrame(renderWave);
          const width = canvas.width;
          const height = canvas.height;
          ctx.clearRect(0, 0, width, height);

          if (!analyser || isPaused || !isRecording) {
            // Idle smooth center line
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();
            return;
          }

          analyser.getByteFrequencyData(dataArray);

          const barCount = 36;
          const barWidth = 4;
          const step = Math.floor(bufferLength / barCount);
          const totalBarsWidth = barCount * barWidth;
          const gap = (width - totalBarsWidth) / (barCount + 1);

          for (let i = 0; i < barCount; i++) {
            const val = dataArray[i * step] || 0;
            const percent = val / 255;
            const barHeight = Math.max(4, percent * (height - 12));
            const x = gap + i * (barWidth + gap);
            const y = (height - barHeight) / 2;

            const grad = ctx.createLinearGradient(0, y, 0, y + barHeight);
            grad.addColorStop(0, '#f59e0b');
            grad.addColorStop(1, '#d97706');

            ctx.fillStyle = grad;
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(x, y, barWidth, barHeight, 2);
            } else {
              ctx.rect(x, y, barWidth, barHeight);
            }
            ctx.fill();
          }
        };

        renderWave();
        return () => cancelAnimationFrame(animId);
      }, [analyser, isRecording, isPaused]);

      return (
        <canvas
          ref={canvasRef}
          width={360}
          height={70}
          className="w-full h-16 rounded-2xl bg-amber-500/5 dark:bg-amber-500/10 border border-amber-500/15"
        />
      );
    }

    function DrawingModal({ isOpen, onClose, onSaveDrawing }) {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [brushColor, setBrushColor] = useState('#18181b');
      const [brushSize, setBrushSize] = useState(4);
      const [history, setHistory] = useState([]);

      useEffect(() => {
        if (!isOpen) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth || 520;
        canvas.height = 340;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        setHistory([canvas.toDataURL()]);
      }, [isOpen]);

      const startDraw = (e) => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.strokeStyle = brushColor;
        ctx.lineWidth = brushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      };

      const stopDraw = () => {
        if (!isDrawing) return;
        setIsDrawing(false);
        const canvas = canvasRef.current;
        if (canvas) {
          setHistory((prev) => [...prev.slice(-15), canvas.toDataURL()]);
        }
      };

      const handleUndo = () => {
        if (history.length <= 1) return;
        const prev = history[history.length - 2];
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          setHistory(history.slice(0, -1));
        };
        img.src = prev;
      };

      const handleSave = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          onSaveDrawing(canvas.toDataURL('image/png'));
          onClose();
        }
      };

      if (!isOpen) return null;
      const colors = ['#18181b', '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ffffff'];

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-popIn">
          <div className="w-full max-w-lg bg-white dark:bg-neutral-900 rounded-3xl border border-neutral-200 dark:border-neutral-800 shadow-2xl p-5 flex flex-col gap-4">
            <div className="flex items-center justify-between pb-2 border-b border-neutral-100 dark:border-neutral-800">
              <div className="flex items-center gap-2 font-semibold text-sm">
                <Icons.Brush className="w-4 h-4 text-amber-500" />
                <span>Draw / Sketch</span>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={handleUndo} className="px-2.5 py-1 text-xs rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-500 transition">
                  Undo
                </button>
                <button onClick={onClose} className="p-1 rounded-full text-neutral-400 hover:text-neutral-600 transition">
                  <Icons.Close className="w-4 h-4" />
                </button>
              </div>
            </div>

            <div className="w-full bg-white rounded-2xl overflow-hidden border border-neutral-200 shadow-inner flex justify-center">
              <canvas
                ref={canvasRef}
                onMouseDown={startDraw}
                onMouseMove={draw}
                onMouseUp={stopDraw}
                onTouchStart={startDraw}
                onTouchMove={draw}
                onTouchEnd={stopDraw}
                className="touch-none cursor-crosshair"
              />
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
              <div className="flex items-center gap-2">
                {colors.map((c) => (
                  <button
                    key={c}
                    onClick={() => setBrushColor(c)}
                    style={{ backgroundColor: c }}
                    className={`w-6 h-6 rounded-full border border-neutral-300 transition ${brushColor === c ? 'scale-125 ring-2 ring-amber-500' : ''}`}
                    title={c === '#ffffff' ? 'Eraser' : c}
                  />
                ))}
                <div className="w-px h-4 bg-neutral-200 dark:bg-neutral-800 mx-1" />
                {[2, 5, 10].map((sz) => (
                  <button
                    key={sz}
                    onClick={() => setBrushSize(sz)}
                    className={`w-6 h-6 rounded-md text-[11px] font-bold flex items-center justify-center ${brushSize === sz ? 'bg-amber-500 text-white' : 'bg-neutral-100 dark:bg-neutral-800'}`}
                  >
                    {sz === 2 ? 'S' : sz === 5 ? 'M' : 'L'}
                  </button>
                ))}
              </div>

              <button
                onClick={handleSave}
                className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs shadow-md shadow-amber-500/25 transition active:scale-95"
              >
                Insert Drawing
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CommandPaletteModal({ isOpen, onClose, onSelectAction, notes, onOpenNote }) {
      const [search, setSearch] = useState('');
      const [selectedIndex, setSelectedIndex] = useState(0);

      const staticActions = [
        { id: 'act_new_text', name: 'Create new text note', icon: '📝', action: () => onSelectAction('new_text') },
        { id: 'act_new_check', name: 'Create new checklist', icon: '✅', action: () => onSelectAction('new_checklist') },
        { id: 'act_new_voice', name: 'Record voice memo', icon: '🎙️', action: () => onSelectAction('new_voice') },
        { id: 'act_toggle_theme', name: 'Toggle dark / light mode', icon: '🌓', action: () => onSelectAction('toggle_theme') },
        { id: 'act_view_archive', name: 'Go to Archive', icon: '📥', action: () => onSelectAction('view_archive') },
        { id: 'act_view_trash', name: 'Go to Trash', icon: '🗑️', action: () => onSelectAction('view_trash') },
        { id: 'act_open_settings', name: 'Open Settings & Backup', icon: '⚙️', action: () => onSelectAction('open_settings') },
      ];

      const matchingNotes = useMemo(() => {
        if (!search.trim()) return [];
        const q = search.toLowerCase();
        return notes.filter(n => (n.title || '').toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q)).slice(0, 5);
      }, [search, notes]);

      const items = useMemo(() => {
        if (!search.trim()) return staticActions;
        const q = search.toLowerCase();
        const filteredActions = staticActions.filter(a => a.name.toLowerCase().includes(q));
        const noteItems = matchingNotes.map(n => ({
          id: n.id,
          name: n.title || 'Untitled Note',
          icon: n.type === 'voice' ? '🎙️' : n.type === 'checklist' ? '✅' : '📄',
          action: () => onOpenNote(n)
        }));
        return [...filteredActions, ...noteItems];
      }, [search, matchingNotes]);

      useEffect(() => {
        setSelectedIndex(0);
      }, [items]);

      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSelectedIndex((prev) => (prev + 1) % items.length);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSelectedIndex((prev) => (prev - 1 + items.length) % items.length);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (items[selectedIndex]) {
              items[selectedIndex].action();
              onClose();
            }
          } else if (e.key === 'Escape') {
            onClose();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, items, selectedIndex, onClose]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 p-4 bg-black/50 backdrop-blur-sm animate-popIn">
          <div className="w-full max-w-lg rounded-3xl bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 shadow-2xl overflow-hidden">
            <div className="flex items-center px-4 py-3.5 border-b border-neutral-100 dark:border-neutral-800 gap-3">
              <Icons.Command className="w-4 h-4 text-neutral-400" />
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Type a command or search notes..."
                className="w-full bg-transparent text-sm outline-none placeholder-neutral-400"
                autoFocus
              />
              <span className="text-[10px] bg-neutral-100 dark:bg-neutral-800 px-2 py-0.5 rounded text-neutral-400">ESC</span>
            </div>

            <div className="max-h-72 overflow-y-auto p-2 space-y-1">
              {items.length === 0 ? (
                <div className="p-4 text-center text-xs text-neutral-400">No matching commands or notes</div>
              ) : (
                items.map((item, idx) => (
                  <div
                    key={item.id}
                    onClick={() => { item.action(); onClose(); }}
                    className={`flex items-center justify-between p-2.5 px-3 rounded-2xl text-xs cursor-pointer transition ${
                      selectedIndex === idx ? 'bg-amber-500 text-white font-semibold' : 'hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-700 dark:text-neutral-200'
                    }`}
                  >
                    <div className="flex items-center gap-2.5 truncate">
                      <span>{item.icon}</span>
                      <span className="truncate">{item.name}</span>
                    </div>
                    {selectedIndex === idx && <span className="text-[10px] opacity-75">Press Enter</span>}
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function VoiceRecorderModal({ isDark, onClose, onSaveVoiceNote }) {
      const [recordingState, setRecordingState] = useState('recording'); // recording, paused, stopped
      const [elapsed, setElapsed] = useState(0);
      const [audioBlob, setAudioBlob] = useState(null);
      const [audioUrl, setAudioUrl] = useState(null);
      const [noteTitle, setNoteTitle] = useState('');
      const [transcript, setTranscript] = useState('');
      const [speechSupported, setSpeechSupported] = useState(true);

      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerRef = useRef(null);
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const speechRecognitionRef = useRef(null);

      useEffect(() => {
        async function start() {
          try {
            const stream = await AudioService.requestMicrophoneStream();

            // Web Audio Analyser
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioCtx();
            audioContextRef.current = audioCtx;
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 128;
            analyserRef.current = analyser;
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);

            // MediaRecorder
            const mr = new MediaRecorder(stream);
            mediaRecorderRef.current = mr;
            audioChunksRef.current = [];
            mr.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) audioChunksRef.current.push(e.data);
            };
            mr.onstop = () => {
              const blob = new Blob(audioChunksRef.current, { type: mr.mimeType || 'audio/webm' });
              setAudioBlob(blob);
              setAudioUrl(URL.createObjectURL(blob));
              setRecordingState('stopped');
              setNoteTitle(`Voice memo - ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
              stream.getTracks().forEach(t => t.stop());
            };
            mr.start(100);

            // Speech-to-Text via Web Speech API
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRec) {
              const rec = new SpeechRec();
              rec.continuous = true;
              rec.interimResults = true;
              rec.onresult = (event) => {
                let fullText = '';
                for (let i = 0; i < event.results.length; i++) {
                  fullText += event.results[i][0].transcript + ' ';
                }
                setTranscript(fullText.trim());
              };
              rec.onerror = () => {};
              try { rec.start(); speechRecognitionRef.current = rec; } catch (e) {}
            } else {
              setSpeechSupported(false);
            }

            timerRef.current = setInterval(() => setElapsed(s => s + 1), 1000);
          } catch (e) {
            console.error(e);
            alert('Could not access the microphone. Please check your browser/site permissions and try again.');
            onClose();
          }
        }

        start();

        return () => {
          clearInterval(timerRef.current);
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            try { mediaRecorderRef.current.stop(); } catch (e) {}
          }
          if (speechRecognitionRef.current) {
            try { speechRecognitionRef.current.stop(); } catch (e) {}
          }
          if (audioContextRef.current && audioContextRef.current.state !== 'closed') {
            try { audioContextRef.current.close(); } catch (e) {}
          }
        };
      }, []);

      // Release the audio preview URL when the modal closes, otherwise each recording leaks memory.
      useEffect(() => {
        return () => {
          if (audioUrl) URL.revokeObjectURL(audioUrl);
        };
      }, [audioUrl]);

      const pauseRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.pause();
          setRecordingState('paused');
          clearInterval(timerRef.current);
          if (speechRecognitionRef.current) try { speechRecognitionRef.current.stop(); } catch (e) {}
        }
      };

      const resumeRecording = () => {
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'paused') {
          mediaRecorderRef.current.resume();
          setRecordingState('recording');
          timerRef.current = setInterval(() => setElapsed(s => s + 1), 1000);
          if (speechRecognitionRef.current) try { speechRecognitionRef.current.start(); } catch (e) {}
        }
      };

      const stopRecording = () => {
        clearInterval(timerRef.current);
        if (speechRecognitionRef.current) {
          try { speechRecognitionRef.current.stop(); } catch (e) {}
        }
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
      };

      const handleSave = () => {
        onSaveVoiceNote({
          type: 'voice',
          title: noteTitle.trim() || 'Voice memo',
          audioBlob,
          duration: elapsed,
          transcript: transcript.trim(),
          color: 'peach'
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-popIn">
          <div className="w-full max-w-md rounded-3xl bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-6 shadow-2xl text-center space-y-5">
            <div className="flex items-center justify-between pb-2 border-b border-neutral-100 dark:border-neutral-800">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse" />
                <h3 className="font-bold text-sm">Voice Studio</h3>
              </div>
              <button onClick={onClose} className="p-1 rounded-full text-neutral-400 hover:text-neutral-600">
                <Icons.Close className="w-4 h-4" />
              </button>
            </div>

            {recordingState !== 'stopped' ? (
              <div className="space-y-4">
                {/* Monospace running timer with glowing indicator */}
                <div className="flex items-center justify-center gap-2">
                  <div className="text-4xl font-mono font-bold text-amber-500 tracking-wider">
                    {formatTime(elapsed)}
                  </div>
                </div>

                {/* Prominent Live Waveform Visualizer */}
                <LiveWaveformVisualizer
                  analyser={analyserRef.current}
                  isRecording={recordingState === 'recording'}
                  isPaused={recordingState === 'paused'}
                />

                {/* Live Speech-to-Text Transcript Preview */}
                {transcript && (
                  <div className="p-3 rounded-2xl bg-neutral-100 dark:bg-neutral-800/60 text-xs text-neutral-600 dark:text-neutral-300 max-h-20 overflow-y-auto text-left leading-relaxed">
                    <span className="font-semibold text-[10px] text-amber-500 uppercase tracking-wider block mb-1">Live Transcript:</span>
                    {transcript}
                  </div>
                )}

                {/* Central record button with radial glowing ring + flanking pause/stop controls */}
                <div className="flex items-center justify-center gap-6 pt-2">
                  {recordingState === 'recording' ? (
                    <button
                      onClick={pauseRecording}
                      className="w-12 h-12 rounded-full bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200 flex items-center justify-center shadow transition active:scale-90"
                      title="Pause"
                    >
                      <Icons.Pause className="w-5 h-5" />
                    </button>
                  ) : (
                    <button
                      onClick={resumeRecording}
                      className="w-12 h-12 rounded-full bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200 flex items-center justify-center shadow transition active:scale-90"
                      title="Resume"
                    >
                      <Icons.Play className="w-5 h-5 ml-0.5" />
                    </button>
                  )}

                  <div
                    onClick={stopRecording}
                    className="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center cursor-pointer shadow-xl animate-glowPulse transition active:scale-95"
                    title="Done Recording"
                  >
                    <Icons.Stop className="w-7 h-7" />
                  </div>
                </div>

                <p className="text-[11px] text-neutral-400">Tap square to finish recording</p>
              </div>
            ) : (
              /* Review & Rename screen before saving */
              <div className="space-y-4 text-left">
                <div className="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-700 dark:text-emerald-400 text-xs font-medium flex items-center gap-2">
                  <Icons.Check className="w-4 h-4" />
                  <span>Recording ready ({formatTime(elapsed)})! Give it a title:</span>
                </div>

                {audioUrl && <audio src={audioUrl} controls className="w-full h-10 rounded-xl" />}

                <div>
                  <label className="block text-xs font-semibold text-neutral-500 mb-1">Title</label>
                  <input
                    type="text"
                    value={noteTitle}
                    onChange={(e) => setNoteTitle(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 text-xs font-medium outline-none"
                    autoFocus
                  />
                </div>

                {transcript && (
                  <div>
                    <label className="block text-xs font-semibold text-neutral-500 mb-1">Transcript (Auto-saved)</label>
                    <textarea
                      value={transcript}
                      onChange={(e) => setTranscript(e.target.value)}
                      rows={2}
                      className="w-full p-2.5 rounded-xl border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 text-xs font-medium outline-none resize-none"
                    />
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={onClose} className="px-4 py-2 text-xs font-semibold rounded-xl text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
                    Discard
                  </button>
                  <button onClick={handleSave} className="px-5 py-2 text-xs font-semibold rounded-xl bg-amber-500 hover:bg-amber-600 text-white shadow-md transition active:scale-95">
                    Save Voice Note
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function NoteInput({ onSave, onOpenVoiceRecorder, onOpenDrawingModal, isDarkMode, labels, onOpenZen }) {
      const [isOpen, setIsOpen] = useState(false);
      const [mode, setMode] = useState('text');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [checklistItems, setChecklistItems] = useState([]);
      const [images, setImages] = useState([]);
      const [isPinned, setIsPinned] = useState(false);
      const [color, setColor] = useState('default');
      const [reminder, setReminder] = useState(null);
      const [tags, setTags] = useState([]);
      const [mood, setMood] = useState(null);
      const [showTemplateMenu, setShowTemplateMenu] = useState(false);

      const containerRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(event) {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            handleCloseAndSave();
          }
        }
        if (isOpen) document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, [isOpen, title, content, checklistItems, images, color, isPinned, reminder, tags, mood, mode]);

      // Clipboard Paste image listener
      useEffect(() => {
        if (!isOpen) return;
        const handlePaste = (e) => {
          if (e.clipboardData && e.clipboardData.files.length > 0) {
            const file = e.clipboardData.files[0];
            if (file.type.startsWith('image/')) {
              e.preventDefault();
              const reader = new FileReader();
              reader.onload = (ev) => setImages(prev => [...prev, ev.target.result]);
              reader.readAsDataURL(file);
            }
          }
        };
        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [isOpen]);

      const handleCloseAndSave = () => {
        const hasText = content.trim().length > 0;
        const hasChecklist = checklistItems.some(i => i.text.trim().length > 0);
        const hasImages = images.length > 0;

        if (title.trim() || hasText || hasChecklist || hasImages) {
          onSave({
            type: mode,
            title: title.trim(),
            content: mode === 'text' ? content.trim() : '',
            checklist: mode === 'checklist' ? checklistItems.filter(i => i.text.trim()) : [],
            images,
            color,
            isPinned,
            reminder,
            tags,
            mood
          });
        }
        setTitle('');
        setContent('');
        setChecklistItems([]);
        setImages([]);
        setIsPinned(false);
        setColor('default');
        setReminder(null);
        setTags([]);
        setMood(null);
        setMode('text');
        setShowTemplateMenu(false);
        setIsOpen(false);
      };

      const applyTemplate = (tpl) => {
        setTitle(tpl.title || '');
        if (tpl.type === 'checklist') {
          setMode('checklist');
          setChecklistItems(tpl.checklist || []);
          setContent('');
        } else {
          setMode('text');
          setContent(tpl.content || '');
          setChecklistItems([]);
        }
        setShowTemplateMenu(false);
        setIsOpen(true);
      };

      const activeColorClass = getColorClass(color, isDarkMode);

      return (
        <div
          ref={containerRef}
          className={`rounded-3xl transition-all duration-200 border ${
            isOpen
              ? `${activeColorClass} shadow-xl ring-2 ring-neutral-200 dark:ring-neutral-800`
              : 'bg-white dark:bg-[#18191d] border-neutral-200/80 dark:border-neutral-800/80 hover:shadow-md'
          }`}
        >
          {!isOpen ? (
            <div
              onClick={() => setIsOpen(true)}
              className="flex items-center justify-between p-3.5 px-5 cursor-text"
            >
              <span className="text-neutral-400 dark:text-neutral-500 text-sm font-medium">
                Take a note...
              </span>
              <div className="flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
                {/* Templates button */}
                <div className="relative">
                  <button
                    onClick={() => setShowTemplateMenu(!showTemplateMenu)}
                    className="p-2 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-500 hover:text-amber-500 transition"
                    title="Templates"
                  >
                    <Icons.Template className="w-4 h-4" />
                  </button>
                  {showTemplateMenu && (
                    <div className="absolute right-0 top-10 z-50 w-48 py-1.5 rounded-2xl bg-white dark:bg-neutral-800 shadow-2xl border border-neutral-200 dark:border-neutral-700 text-xs animate-popIn">
                      <span className="px-3 py-1 font-semibold text-[10px] text-neutral-400 uppercase tracking-wider block">Templates</span>
                      {TEMPLATES.map(tpl => (
                        <button
                          key={tpl.id}
                          onClick={() => applyTemplate(tpl)}
                          className="w-full text-left px-3 py-2 hover:bg-neutral-100 dark:hover:bg-neutral-700/60 flex items-center gap-2"
                        >
                          <span>{tpl.type === 'checklist' ? '📋' : '📝'}</span>
                          <span className="truncate">{tpl.name}</span>

                    </div>

                <button
                  onClick={() => { setIsOpen(true); setMode('checklist'); setChecklistItems([{ id: 'it_0', text: '', checked: false }]); }}
                  className="p-2 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-500 hover:text-amber-500 transition"
                  title="Checklist"
                >
                  <Icons.Checklist className="w-4 h-4" />
                </button>
                <button
                  onClick={() => { setIsOpen(true); onOpenDrawingModal((img) => setImages(prev => [...prev, img])); }}
                  className="p-2 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-500 hover:text-amber-500 transition"
                  title="Draw"
                >
                  <Icons.Brush className="w-4 h-4" />
                </button>
                <button
                  onClick={() => { setIsOpen(true); fileInputRef.current?.click(); }}
                  className="p-2 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-500 hover:text-amber-500 transition"
                  title="Attach Image"
                >
                  <Icons.Image className="w-4 h-4" />
                </button>
                <button
                  onClick={onOpenVoiceRecorder}
                  className="p-2 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-500 hover:text-amber-500 transition"
                  title="Voice Note"
                >
                  <Icons.Mic className="w-4 h-4" />
                </button>
                <input
                  type="file"
                  ref={fileInputRef}
                  accept="image/*"
                  onChange={(e) => {
                    if (e.target.files && e.target.files[0]) {
                      const reader = new FileReader();
                      reader.onload = (ev) => setImages(prev => [...prev, ev.target.result]);
                      reader.readAsDataURL(e.target.files[0]);
                    }
                  }}
                  className="hidden"
                />
              </div>
            </div>
          ) : (
            <div className="p-4 sm:p-5 space-y-3">
              {/* Attached Images */}
              {images.length > 0 && (
                <div className="flex flex-wrap gap-2 pt-1">
                  {images.map((img, idx) => (
                    <div key={idx} className="relative rounded-xl overflow-hidden shadow-sm">
                      <img src={img} alt="Attached" className="h-20 w-24 object-cover rounded-xl" />
                      <button
                        type="button"
                        onClick={() => setImages(images.filter((_, i) => i !== idx))}
                        className="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/60 text-white flex items-center justify-center text-xs hover:bg-red-600"
                      >
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {/* Top Row: Title + Pin button on the far right (NO ACTION BUTTONS HERE) */}
              <div className="flex items-center justify-between gap-3">
                <input
                  type="text"
                  placeholder="Title"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full bg-transparent font-semibold text-base outline-none placeholder-neutral-400"
                  autoFocus
                />
                <div className="flex items-center gap-1">
                  <button
                    type="button"
                    onClick={() => onOpenZen(title, content, (t, c) => { setTitle(t); setContent(c); })}
                    className="p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-neutral-400 hover:text-amber-500 transition"
                    title="Zen Focus Mode"
                  >
                    <Icons.Expand className="w-4 h-4" />
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsPinned(!isPinned)}
                    className={`p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition flex-shrink-0 ${isPinned ? 'text-amber-500' : 'text-neutral-400'}`}
                    title={isPinned ? 'Unpin' : 'Pin'}
                  >
                    <Icons.Pin className="w-4 h-4" filled={isPinned} />
                  </button>
                </div>
              </div>

              {/* Note Content or Checklist */}
              {mode === 'text' ? (
                <textarea
                  placeholder="Take a note..."
                  value={content}
                  onChange={(e) => setContent(e.target.value)}
                  rows={3}
                  className="w-full bg-transparent text-sm resize-none outline-none placeholder-neutral-400 leading-relaxed"
                />
              ) : (
                <div className="space-y-2 py-1">
                  {checklistItems.map((item) => (
                    <div key={item.id} className="flex items-center gap-2">
                      <input
                        type="checkbox"
                        checked={item.checked}
                        onChange={(e) => {
                          setChecklistItems(checklistItems.map(i => i.id === item.id ? { ...i, checked: e.target.checked } : i));
                        }}
                        className="w-4 h-4 rounded text-amber-500 accent-amber-500 cursor-pointer"
                      />
                      <input
                        type="text"
                        placeholder="List item..."
                        value={item.text}
                        onChange={(e) => {
                          setChecklistItems(checklistItems.map(i => i.id === item.id ? { ...i, text: e.target.value } : i));
                        }}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            setChecklistItems([...checklistItems, { id: 'it_' + Date.now(), text: '', checked: false }]);
                          }
                        }}
                        className={`w-full bg-transparent text-xs outline-none ${item.checked ? 'line-through opacity-50' : ''}`}
                      />
                      <button
                        type="button"
                        onClick={() => setChecklistItems(checklistItems.filter(i => i.id !== item.id))}
                        className="text-neutral-400 hover:text-red-500 p-1"
                      >
                        ×
                      </button>
                    </div>
                  ))}
                  <button
                    type="button"
                    onClick={() => setChecklistItems([...checklistItems, { id: 'it_' + Date.now(), text: '', checked: false }])}
                    className="flex items-center gap-1.5 text-xs text-amber-600 dark:text-amber-400 font-medium py-1"
                  >
                    + Add item
                  </button>
                </div>
              )}

              {/* Badges */}
              {(tags.length > 0 || reminder || mood) && (
                <div className="flex flex-wrap items-center gap-1.5 pt-1">
                  {mood && <span className="text-sm">{mood}</span>}
                  {reminder && (
                    <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] bg-black/5 dark:bg-white/10 font-medium">
                      <Icons.Bell className="w-3 h-3 text-amber-500" />
                      {formatReminderDate(reminder)}
                      <button onClick={() => setReminder(null)} className="ml-1 hover:text-red-500">×</button>
                    </span>
                  )}
                  {tags.map((t) => (
                    <span key={t} className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] bg-black/5 dark:bg-white/10 font-medium">
                      #{t}
                      <button onClick={() => setTags(tags.filter(item => item !== t))} className="ml-1 hover:text-red-500">×</button>
                    </span>
                  ))}
                </div>
              )}

              {/* Bottom Toolbar: All action icons housed safely here */}
              <div className="flex items-center justify-between pt-2.5 border-t border-black/5 dark:border-white/10">
                <div className="flex items-center gap-1">
                  <ColorPickerPopover currentColor={color} onSelectColor={setColor} />
                  <ReminderPopover reminder={reminder} onSetReminder={setReminder} />
                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    className="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-neutral-500"
                    title="Attach Image"
                  >
                    <Icons.Image className="w-4 h-4" />
                  </button>
                  <button
                    type="button"
                    onClick={() => onOpenDrawingModal((img) => setImages(prev => [...prev, img]))}
                    className="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-neutral-500"
                    title="Add Drawing"
                  >
                    <Icons.Brush className="w-4 h-4" />
                  </button>
                  <button
                    type="button"
                    onClick={() => setMode(mode === 'text' ? 'checklist' : 'text')}
                    className="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-neutral-500"
                    title="Toggle Checklist"
                  >
                    <Icons.Checklist className="w-4 h-4" />
                  </button>
                </div>

                <button
                  onClick={handleCloseAndSave}
                  className="px-4 py-1.5 text-xs font-semibold rounded-xl bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 hover:opacity-90 active:scale-95 transition shadow-sm"
                >
                  Done
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ColorPickerPopover({ currentColor, onSelectColor }) {
