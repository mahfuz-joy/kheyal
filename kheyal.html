      const ref = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        }
        if (open) document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, [open]);

      return (
        <div className="relative" ref={ref} onClick={(e) => e.stopPropagation()}>
          <button
            type="button"
            onClick={() => setOpen(!open)}
            className="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-neutral-500 hover:text-neutral-800 dark:hover:text-neutral-200 transition"
            title="Note Color"
          >
            <Icons.Palette className="w-4 h-4" />
          </button>

          {open && (
            <div className="absolute left-0 bottom-8 z-50 p-2 rounded-2xl bg-white dark:bg-neutral-800 shadow-2xl border border-neutral-200 dark:border-neutral-700 grid grid-cols-5 gap-1.5 animate-popIn">
              {COLOR_OPTIONS.map((c) => (
                <button
                  key={c.id}
                  type="button"
                  onClick={() => { onSelectColor(c.id); setOpen(false); }}
                  className={`w-5 h-5 rounded-full border border-neutral-300 dark:border-neutral-600 transition hover:scale-125 ${c.swatch} ${
                    currentColor === c.id ? 'ring-2 ring-amber-500 scale-110' : ''
                  }`}
                  title={c.name}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function ReminderPopover({ reminder, onSetReminder }) {
      const [open, setOpen] = useState(false);
      const [customDate, setCustomDate] = useState('');
      const ref = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        }
        if (open) document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, [open]);

      const setPreset = (type) => {
        if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
        const d = new Date();
        if (type === 'later') d.setHours(20, 0, 0, 0);
        else if (type === 'tomorrow') { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); }
        else if (type === 'nextweek') { d.setDate(d.getDate() + 7); d.setHours(9, 0, 0, 0); }
        onSetReminder(d.toISOString());
        setOpen(false);
      };

      return (
        <div className="relative" ref={ref} onClick={(e) => e.stopPropagation()}>
          <button
            type="button"
            onClick={() => setOpen(!open)}
            className="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-neutral-500 hover:text-neutral-800 dark:hover:text-neutral-200 transition"
            title="Set Reminder"
          >
            <Icons.Bell className="w-4 h-4" />
          </button>

          {open && (
            <div className="absolute left-0 bottom-8 z-50 w-48 p-2 rounded-2xl bg-white dark:bg-neutral-800 shadow-2xl border border-neutral-200 dark:border-neutral-700 animate-popIn text-xs space-y-1">
              <span className="px-2 py-1 font-semibold text-[10px] text-neutral-400 block uppercase tracking-wider">Reminder</span>
              <button onClick={() => setPreset('later')} className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-700 flex justify-between">
                <span>Later today</span><span className="text-neutral-400">8:00 PM</span>
              </button>
              <button onClick={() => setPreset('tomorrow')} className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-700 flex justify-between">
                <span>Tomorrow</span><span className="text-neutral-400">9:00 AM</span>
              </button>
              <button onClick={() => setPreset('nextweek')} className="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-700 flex justify-between">
                <span>Next week</span><span className="text-neutral-400">Mon 9:00 AM</span>
              </button>

              <div className="pt-2 border-t border-neutral-100 dark:border-neutral-700 px-1">
                <input
                  type="datetime-local"
                  value={customDate}
                  onChange={(e) => setCustomDate(e.target.value)}
                  className="w-full p-1 text-[11px] rounded-lg bg-neutral-100 dark:bg-neutral-900 outline-none"
                />
                <div className="flex justify-between items-center mt-1.5">
                  {reminder && (
                    <button onClick={() => { onSetReminder(null); setOpen(false); }} className="text-red-500 hover:underline text-[10px]">
                      Clear
                    </button>
                  )}
                  <button
                    onClick={() => {
                      if (customDate) {
                        if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
                        onSetReminder(new Date(customDate).toISOString());
                        setOpen(false);
                      }
                    }}
                    className="ml-auto px-2.5 py-0.5 rounded-lg bg-amber-500 text-white font-semibold text-[10px]"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function NoteCard({
      note,
      isDark,
      viewMode,
      isSelected,
      isSelectMode,
      onToggleSelect,
      onPin,
      onArchive,
      onTrash,
      onRestore,
      onDeletePermanent,
      onChangeColor,
      onDuplicate,
      onShare,
      onToggleChecklist,
      onSetReminder,
      onOpenLightbox,
      onOpenDrawingModal,
      labels,
      onToggleNoteLabel,
      onSetMood,
      onUpdateNote,
      isTrashView
    }) {
      const cardColorClass = getColorClass(note.color, isDark);
      const isVoice = note.type === 'voice';

      // Audio playback states
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [audioDuration, setAudioDuration] = useState(note.duration || 0);
      const [playbackRate, setPlaybackRate] = useState(1);
      const [showTranscript, setShowTranscript] = useState(false);
      const audioRef = useRef(null);
      const [audioUrl, setAudioUrl] = useState(null);

      // Touch Swipe Gesture states for Mobile
      const [touchStartX, setTouchStartX] = useState(null);
      const [swipeOffset, setSwipeOffset] = useState(0);

      useEffect(() => {
        if (note.audioBlob) {
          const url = URL.createObjectURL(note.audioBlob);
          setAudioUrl(url);
          return () => URL.revokeObjectURL(url);
        }
        setAudioUrl(null);
      }, [note.audioBlob]);

      const togglePlayPause = (e) => {
        e.stopPropagation();
        if (!audioRef.current) return;
        if (isPlaying) audioRef.current.pause();
        else audioRef.current.play().catch(() => {});
      };

      const cycleSpeed = (e) => {
        e.stopPropagation();
        const speeds = [1, 1.5, 2, 0.5];
        const next = speeds[(speeds.indexOf(playbackRate) + 1) % speeds.length];
        setPlaybackRate(next);
        if (audioRef.current) audioRef.current.playbackRate = next;
      };

      // Touch handlers for mobile swipe-to-archive / swipe-to-trash
      const handleTouchStart = (e) => {
        setTouchStartX(e.touches[0].clientX);
      };

      const handleTouchMove = (e) => {
        if (touchStartX === null) return;
        const currentX = e.touches[0].clientX;
        const diff = currentX - touchStartX;
        if (Math.abs(diff) < 120) setSwipeOffset(diff);
      };

      const handleTouchEnd = () => {
        if (swipeOffset > 75 && !isTrashView) {
          onArchive();
        } else if (swipeOffset < -75 && !isTrashView) {
          onTrash();
        }
        setTouchStartX(null);
        setSwipeOffset(0);
      };

      const items = note.checklist || [];
      const unchecked = items.filter(i => !i.checked);
      const checked = items.filter(i => i.checked);

      return (
        <div
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
          style={{ transform: `translateX(${swipeOffset}px)` }}
          className={`break-inside-avoid group relative rounded-3xl border p-4 sm:p-5 transition-all duration-200 hover:shadow-lg ${cardColorClass} ${
            viewMode === 'list' ? 'flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 w-full' : ''
          } ${isSelected ? 'ring-2 ring-amber-500 scale-[0.99]' : ''}`}
        >
          {/* Mobile Swipe Indicators */}
          {swipeOffset > 25 && (
            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-amber-500 font-bold text-xs flex items-center gap-1">
              <Icons.Archive className="w-4 h-4" /> Archive
            </div>
          )}
          {swipeOffset < -25 && (
            <div className="absolute right-3 top-1/2 -translate-y-1/2 text-red-500 font-bold text-xs flex items-center gap-1">
              Delete <Icons.Trash className="w-4 h-4" />
            </div>
          )}

          <div className="flex-1 min-w-0">
            {/* TOP HEADER: Type badge / Mood on the left, PIN on the far right. NO ACTION OVERLAP */}
            <div className="flex items-center justify-between gap-2 mb-2">
              <div className="flex items-center gap-1.5 flex-wrap">
                {isSelectMode && (
                  <input
                    type="checkbox"
                    checked={isSelected}
                    onChange={(e) => { e.stopPropagation(); onToggleSelect(); }}
                    className="w-4 h-4 rounded text-amber-500 accent-amber-500 cursor-pointer"
                  />
                )}
                {note.mood && <span className="text-sm">{note.mood}</span>}
                {isVoice ? (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/15 text-amber-700 dark:text-amber-400">
                    <Icons.Mic className="w-3 h-3 text-amber-600 dark:text-amber-400" />
                    <span>Voice Memo</span>
                    <span className="opacity-60 font-mono text-[10px]">({formatTime(audioDuration)})</span>
                  </span>
                ) : note.type === 'checklist' ? (
                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-black/5 dark:bg-white/10 opacity-70">
                    <Icons.Checklist className="w-3 h-3" />
                    <span>Checklist</span>
                  </span>
                ) : null}
              </div>

              {!isTrashView && (
                <button
                  onClick={(e) => { e.stopPropagation(); onPin(); }}
                  className={`p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition flex-shrink-0 ${
                    note.isPinned ? 'text-amber-500 opacity-100' : 'text-neutral-400 opacity-0 group-hover:opacity-100'
                  }`}
                  title={note.isPinned ? 'Unpin' : 'Pin note'}
                >
                  <Icons.Pin className="w-4 h-4" filled={note.isPinned} />
                </button>
              )}
            </div>

            {/* Attached Images */}
            {note.images && note.images.length > 0 && (
              <div className="mb-3 rounded-2xl overflow-hidden flex flex-wrap gap-1.5">
                {note.images.map((img, idx) => (
                  <img
                    key={idx}
                    src={img}
                    alt="Attachment"
                    onClick={(e) => { e.stopPropagation(); onOpenLightbox(img); }}
                    className="h-28 w-full object-cover rounded-xl cursor-pointer hover:opacity-95"
                  />
                ))}
              </div>
            )}

            {/* Note Title: FULL WIDTH with no obstruction */}
            {note.title && (
              <h3 className="font-bold text-base mb-1.5 tracking-tight leading-snug break-words">
                {note.title}
              </h3>
            )}

            {/* Text Content */}
            {note.type === 'text' && note.content && (
              <p className="text-xs sm:text-sm whitespace-pre-wrap leading-relaxed opacity-90 break-words line-clamp-6 mb-2">
                {note.content}
              </p>
            )}

            {/* Checklist Items */}
            {note.type === 'checklist' && (
              <div className="space-y-1.5 my-2 text-xs sm:text-sm">
                {unchecked.map((item) => (
                  <div key={item.id} className="flex items-center gap-2">
                    <input
                      type="checkbox"
                      checked={false}
                      onChange={(e) => {
                        e.stopPropagation();
                        const updated = items.map(i => i.id === item.id ? { ...i, checked: true } : i);
                        onUpdateNote({ ...note, checklist: updated });
                      }}
                      className="w-3.5 h-3.5 accent-amber-500 rounded cursor-pointer"
                    />
                    <span className="truncate">{item.text}</span>
                  </div>
                ))}
                {checked.length > 0 && (
                  <div className="pt-1 text-[11px] opacity-50">
                    +{checked.length} completed item{checked.length > 1 ? 's' : ''}
                  </div>
                )}
              </div>
            )}

            {/* Audio Player for Voice Note */}
            {isVoice && audioUrl && (
              <div onClick={(e) => e.stopPropagation()} className="my-2 p-2.5 rounded-2xl bg-black/5 dark:bg-white/5 flex flex-col gap-2">
                <audio
                  ref={audioRef}
                  src={audioUrl}
                  onPlay={() => setIsPlaying(true)}
                  onPause={() => setIsPlaying(false)}
                  onTimeUpdate={() => audioRef.current && setCurrentTime(audioRef.current.currentTime)}
                  onEnded={() => { setIsPlaying(false); setCurrentTime(0); }}
                />
                <div className="flex items-center gap-3">
                  <button
                    onClick={togglePlayPause}
                    className="w-8 h-8 rounded-full bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center shadow flex-shrink-0"
                  >
                    {isPlaying ? <Icons.Pause className="w-3.5 h-3.5" /> : <Icons.Play className="w-3.5 h-3.5 ml-0.5" />}
                  </button>
                  <div className="flex-1 flex flex-col justify-center">
                    <input
                      type="range"
                      min="0"
                      max={audioDuration || 1}
                      step="0.1"
                      value={currentTime}
                      onChange={(e) => {
                        const newTime = parseFloat(e.target.value);
                        if (audioRef.current) {
                          audioRef.current.currentTime = newTime;
                          setCurrentTime(newTime);
                        }
                      }}
                      className="w-full accent-amber-500 h-1 bg-neutral-200 dark:bg-neutral-700 rounded-lg cursor-pointer"
                    />
                    <div className="flex justify-between text-[9px] opacity-60 mt-1 font-mono">
                      <span>{formatTime(currentTime)}</span>
                      <span>{formatTime(audioDuration)}</span>
                    </div>
                  </div>
                  <button onClick={cycleSpeed} className="px-1.5 py-0.5 rounded-lg bg-black/5 dark:bg-white/10 text-[10px] font-bold">
                    {playbackRate}x
                  </button>
                </div>

                {/* Expandable Speech-to-Text Transcript */}
                {note.transcript && (
                  <div className="pt-1 text-[11px]">
                    <button
                      onClick={() => setShowTranscript(!showTranscript)}
                      className="text-[10px] font-semibold text-amber-600 dark:text-amber-400 hover:underline flex items-center gap-1"
                    >
                      <span>{showTranscript ? 'Hide transcript' : 'Show transcript'}</span>
                    </button>
                    {showTranscript && (
                      <p className="mt-1.5 p-2 rounded-xl bg-black/5 dark:bg-white/5 opacity-80 leading-relaxed italic">
                        "{note.transcript}"
                      </p>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* Badges: Tags & Reminders */}
            <div className="flex flex-wrap gap-1 mt-2.5">
              {note.reminder && (
                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] bg-amber-500/15 text-amber-700 dark:text-amber-400 font-medium">
                  <Icons.Bell className="w-2.5 h-2.5" />
                  {formatReminderDate(note.reminder)}
                </span>
              )}
              {note.tags && note.tags.map((t) => (
                <span key={t} className="inline-flex items-center text-[10px] px-2 py-0.5 rounded-md bg-black/5 dark:bg-white/10 opacity-75">
                  #{t}
                </span>
              ))}
            </div>
          </div>

          {/* BOTTOM TOOLBAR: Actions isolated here cleanly without any title obstruction */}
          <div
            onClick={(e) => e.stopPropagation()}
            className="mt-3 pt-2.5 border-t border-black/5 dark:border-white/10 flex items-center justify-between opacity-0 group-hover:opacity-100 transition-opacity"
          >
            {!isTrashView ? (
              <div className="flex items-center justify-between w-full">
                <div className="flex items-center gap-0.5">
                  <ReminderPopover reminder={note.reminder} onSetReminder={(r) => onSetReminder(r)} />
                  <ColorPickerPopover currentColor={note.color} onSelectColor={(c) => onChangeColor(c)} />
                  <button onClick={onArchive} className="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 text-neutral-500" title="Archive">
                    <Icons.Archive className="w-4 h-4" />
                  </button>
                </div>
                <NoteActionMenu
                  note={note}
                  isTrashView={isTrashView}
                  onArchive={onArchive}
                  onTrash={onTrash}
                  onRestore={onRestore}
                  onDeletePermanent={onDeletePermanent}
                  onDuplicate={onDuplicate}
                  onShare={onShare}
                  onToggleChecklist={onToggleChecklist}
                  onAddDrawing={() => onOpenDrawingModal((img) => onUpdateNote({ ...note, images: [...(note.images || []), img] }))}
                  labels={labels}
                  onToggleNoteLabel={onToggleNoteLabel}
                  onSetMood={(m) => onSetMood(m)}
                />
              </div>
            ) : (
              <div className="flex items-center justify-between w-full">
                <button onClick={onRestore} className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-black/5 hover:bg-black/10">
                  Restore
                </button>
                <button onClick={onDeletePermanent} className="text-xs font-semibold px-2.5 py-1 text-red-600 hover:bg-red-50">
                  Delete forever
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [notes, setNotes] = useState([]);
      const [currentView, setCurrentView] = useState('notes'); // 'notes' | 'reminders' | 'archive' | 'trash' | 'label'
      const [selectedLabel, setSelectedLabel] = useState(null);
      const [labels, setLabels] = useState(() => {
        try {
          const raw = localStorage.getItem(LABELS_KEY);
          return raw ? JSON.parse(raw) : ['Work', 'Personal', 'Ideas'];
        } catch (e) {
          return ['Work', 'Personal'];
        }
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [accentColor, setAccentColor] = useState(ACCENT_COLORS[0]);

      // View & Sort states
      const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'list'
      const [sortBy, setSortBy] = useState('updated'); // 'updated' | 'created' | 'title' | 'color'

      // Multi-Select state
      const [isSelectMode, setIsSelectMode] = useState(false);
      const [selectedNoteIds, setSelectedNoteIds] = useState([]);

      // Modals
      const [isVoiceRecorderOpen, setIsVoiceRecorderOpen] = useState(false);
      const [isDrawingModalOpen, setIsDrawingModalOpen] = useState(false);
      const [drawingCallback, setDrawingCallback] = useState(null);
      const [isEditLabelsOpen, setIsEditLabelsOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isCommandPaletteOpen, setIsCommandPaletteOpen] = useState(false);
      const [lightboxImage, setLightboxImage] = useState(null);

      // Zen Focus Modal state
      const [zenModalData, setZenModalData] = useState(null);

      // Undo Snackbar state
      const [undoState, setUndoState] = useState(null); // { message: string, undoAction: function }
      const undoTimerRef = useRef(null);

      // "On This Day" banner state
      const [showOnThisDay, setShowOnThisDay] = useState(() => {
        return localStorage.getItem(ON_THIS_DAY_KEY) !== 'false';
      });
      const [dismissedMemory, setDismissedMemory] = useState(false);

      // Update Checker state
      const [updateBannerInfo, setUpdateBannerInfo] = useState(null);

      useEffect(() => {
        const savedTheme = localStorage.getItem('notes_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          setIsDarkMode(true);
        }
        dbGetAllNotes().then(stored => setNotes(stored));

        // Quick capture widget URL params: ?action=new or ?action=record
        const params = new URLSearchParams(window.location.search);
        if (params.get('action') === 'record') {
          setIsVoiceRecorderOpen(true);
        }

        // Silent GitHub Update Checker
        checkForUpdates(false);
      }, []);

      // Reminders only mean something if we actually alert the person when they come due.
      // While the app is open, check every 30s for any reminder whose time has passed and
      // hasn't been shown yet, then fire a real browser notification for it.
      useEffect(() => {
        const firedKey = 'notes_fired_reminders';
        const getFired = () => {
          try { return new Set(JSON.parse(localStorage.getItem(firedKey) || '[]')); }
          catch (e) { return new Set(); }
        };
        const markFired = (key) => {
          const fired = getFired();
          fired.add(key);
          localStorage.setItem(firedKey, JSON.stringify([...fired].slice(-200)));
        };

        const checkReminders = () => {
          const fired = getFired();
          const now = Date.now();
          notes.forEach((n) => {
            if (!n.reminder || n.isTrash || n.isArchived) return;
            const dueAt = new Date(n.reminder).getTime();
            if (isNaN(dueAt) || dueAt > now) return;
            const key = n.id + ':' + n.reminder;
            if (fired.has(key)) return;
            markFired(key);
            if (window.Notification && Notification.permission === 'granted') {
              try {
                new Notification(n.title || 'Kheyal reminder', {
                  body: (n.content || n.transcript || 'Tap to open Kheyal').slice(0, 120),
                  icon: undefined,
                  tag: n.id
                });
              } catch (e) {}
            }
          });
        };

        checkReminders();
        const intervalId = setInterval(checkReminders, 30000);
        return () => clearInterval(intervalId);
      }, [notes]);

      useEffect(() => {
        localStorage.setItem('notes_theme', isDarkMode ? 'dark' : 'light');
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const applyAccent = (acc) => {
        setAccentColor(acc);
        document.documentElement.style.setProperty('--accent-color', acc.color);
        document.documentElement.style.setProperty('--accent-hover', acc.hover);
        document.documentElement.style.setProperty('--accent-light', acc.light);
        document.documentElement.style.setProperty('--accent-ring', acc.ring);
      };

      const checkForUpdates = async (alertIfUpToDate = false) => {
        try {
          const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`);
          if (res.ok) {
            const data = await res.json();
            const latestTag = (data.tag_name || '').replace(/^v/, '');
            const dismissed = localStorage.getItem('notes_dismissed_version');
            const isNewer = latestTag && compareVersions(latestTag, APP_VERSION) > 0;
            if (isNewer && dismissed !== latestTag) {
              setUpdateBannerInfo({ version: latestTag, url: data.html_url });
            } else if (alertIfUpToDate) {
              alert('App is already on the latest version!');
            }
          } else if (alertIfUpToDate) {
            alert('Could not check for updates right now. Please try again later.');
          }
        } catch (e) {
          if (alertIfUpToDate) {
            alert('Could not check for updates. Check your internet connection.');
          }
          // Otherwise fail silently on the automatic background check.
        }
      };

      const saveLabels = (next) => {
        setLabels(next);
        localStorage.setItem(LABELS_KEY, JSON.stringify(next));
      };

      const toggleOnThisDayPref = (val) => {
        setShowOnThisDay(val);
        localStorage.setItem(ON_THIS_DAY_KEY, String(val));
      };

      const handleSaveNote = async (noteData) => {
        const noteToSave = {
          id: noteData.id || 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
          type: noteData.type || 'text',
          title: noteData.title || '',
          content: noteData.content || '',
          checklist: noteData.checklist || [],
          images: noteData.images || [],
          audioBlob: noteData.audioBlob || null,
          duration: noteData.duration || 0,
          transcript: noteData.transcript || '',
          color: noteData.color || 'default',
          reminder: noteData.reminder || null,
          isPinned: noteData.isPinned || false,
          isArchived: noteData.isArchived || false,
          isTrash: noteData.isTrash || false,
          tags: noteData.tags || [],
          mood: noteData.mood || null,
          createdAt: noteData.createdAt || Date.now(),
          updatedAt: Date.now()
        };

        await dbSaveNote(noteToSave);
        setNotes((prev) => {
          const index = prev.findIndex((n) => n.id === noteToSave.id);
          if (index >= 0) {
            const updated = [...prev];
            updated[index] = noteToSave;
            return updated;
          }
          return [noteToSave, ...prev];
        });
      };

      const triggerUndoableAction = (message, previousNotes, nextNotes) => {
        setNotes(nextNotes);
        nextNotes.forEach(n => dbSaveNote(n));

        if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
        setUndoState({
          message,
          undoAction: () => {
            setNotes(previousNotes);
            previousNotes.forEach(n => dbSaveNote(n));
            setUndoState(null);
          }
        });

        undoTimerRef.current = setTimeout(() => {
          setUndoState(null);
        }, 5000);
      };

      const handleArchiveNote = (note) => {
        const prev = [...notes];
        const updated = notes.map(n => n.id === note.id ? { ...n, isArchived: !n.isArchived, isPinned: false } : n);
        triggerUndoableAction(note.isArchived ? 'Note unarchived' : 'Note archived', prev, updated);
      };

      const handleTrashNote = (note) => {
        const prev = [...notes];
        const updated = notes.map(n => n.id === note.id ? { ...n, isTrash: true, isPinned: false } : n);
        triggerUndoableAction('Note moved to trash', prev, updated);
      };

      const handleRestoreNote = (note) => {
        const prev = [...notes];
        const updated = notes.map(n => n.id === note.id ? { ...n, isTrash: false } : n);
        triggerUndoableAction('Note restored', prev, updated);
      };

      // Bulk actions
      const handleBulkArchive = () => {
        const prev = [...notes];
        const updated = notes.map(n => selectedNoteIds.includes(n.id) ? { ...n, isArchived: true, isPinned: false } : n);
        triggerUndoableAction(`${selectedNoteIds.length} notes archived`, prev, updated);
        setSelectedNoteIds([]);
        setIsSelectMode(false);
      };

      const handleBulkTrash = () => {
        const prev = [...notes];
        const updated = notes.map(n => selectedNoteIds.includes(n.id) ? { ...n, isTrash: true, isPinned: false } : n);
        triggerUndoableAction(`${selectedNoteIds.length} notes moved to trash`, prev, updated);
        setSelectedNoteIds([]);
        setIsSelectMode(false);
      };

      const handleBulkColor = (colorId) => {
        const updated = notes.map(n => selectedNoteIds.includes(n.id) ? { ...n, color: colorId } : n);
        setNotes(updated);
        updated.filter(n => selectedNoteIds.includes(n.id)).forEach(n => dbSaveNote(n));
        setSelectedNoteIds([]);
        setIsSelectMode(false);
      };

      // Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setIsCommandPaletteOpen(true);
          } else if (e.key === '/') {
            e.preventDefault();
            document.getElementById('global-search-input')?.focus();
          } else if (e.key.toLowerCase() === 'n') {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (e.key === 'Escape') {
            setIsCommandPaletteOpen(false);
            setIsSettingsOpen(false);
            setIsVoiceRecorderOpen(false);
            setIsDrawingModalOpen(false);
            setLightboxImage(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // JSON Backup & Restore
      const handleExportJSON = async () => {
        const exportable = await Promise.all(
          notes.map(async (n) => {
            const copy = { ...n };
            if (copy.audioBlob) {
              copy.audioBlobBase64 = await blobToBase64(copy.audioBlob);
              delete copy.audioBlob;
            }
            return copy;
          })
        );
        const jsonStr = JSON.stringify(exportable, null, 2);
        const filename = `kheyal_backup_${new Date().toISOString().slice(0, 10)}.json`;

        // On mobile, offer the native share sheet first so it can go straight to Drive/Files/etc.
        if (navigator.share) {
          try {
            const file = new File([jsonStr], filename, { type: 'application/json' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: 'Kheyal Backup' });
              return;
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
            // fall through to direct download below
          }
        }

        // Blob + object URL handles any backup size reliably, unlike a data: URL.
        try {
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            if (a.parentNode) a.parentNode.removeChild(a);
            URL.revokeObjectURL(url);
          }, 1000);
        } catch (err) {
          alert('Could not export backup: ' + err.message);
        }
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              for (const item of imported) {
                if (item.audioBlobBase64) {
                  item.audioBlob = await base64ToBlob(item.audioBlobBase64);
                  delete item.audioBlobBase64;
                }
                await dbSaveNote(item);
              }
              setNotes(await dbGetAllNotes());
              setIsSettingsOpen(false);
            } else {
              alert('This file doesn\'t look like a Kheyal backup.');
            }
          } catch (err) {
            alert('Could not read this backup file. Make sure it\'s a valid Kheyal export.');
          } finally {
            e.target.value = '';
          }
        };
        reader.onerror = () => {
          alert('Error reading the selected file. Please try again.');
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      // "On This Day" calculation
      const onThisDayNote = useMemo(() => {
        if (!showOnThisDay || dismissedMemory) return null;
        const now = new Date();
        return notes.find(n => {
          if (n.isTrash || n.isArchived) return false;
          const created = new Date(n.createdAt || 0);
          const diffDays = Math.round((now - created) / (1000 * 60 * 60 * 24));
          return diffDays === 7 || diffDays === 30 || diffDays === 365;
        });
      }, [notes, showOnThisDay, dismissedMemory]);

      // Filtered notes
      const filteredNotes = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        return notes.filter((n) => {
          if (currentView === 'trash') {
            if (!n.isTrash) return false;
          } else {
            if (n.isTrash) return false;
            if (currentView === 'archive' && !n.isArchived) return false;
            if (currentView === 'notes' && n.isArchived) return false;
            if (currentView === 'reminders' && (!n.reminder || n.isArchived)) return false;
            if (currentView === 'label' && selectedLabel && !(n.tags || []).includes(selectedLabel)) return false;
          }
          if (q) {
            const titleMatch = (n.title || '').toLowerCase().includes(q);
            const contentMatch = (n.content || '').toLowerCase().includes(q);
            const checkMatch = (n.checklist || []).some(i => i.text.toLowerCase().includes(q));
            const transcriptMatch = (n.transcript || '').toLowerCase().includes(q);
            if (!titleMatch && !contentMatch && !checkMatch && !transcriptMatch) return false;
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'created') return (b.createdAt || 0) - (a.createdAt || 0);
          if (sortBy === 'title') return (a.title || '').localeCompare(b.title || '');
          if (sortBy === 'color') return (a.color || '').localeCompare(b.color || '');
          return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
        });
      }, [notes, currentView, selectedLabel, searchQuery, sortBy]);

      const pinnedNotes = useMemo(() => currentView === 'notes' ? filteredNotes.filter(n => n.isPinned) : [], [filteredNotes, currentView]);
      const otherNotes = useMemo(() => currentView === 'notes' ? filteredNotes.filter(n => !n.isPinned) : filteredNotes, [filteredNotes, currentView]);

      return (

                    setUpdateBannerInfo(null);

                  className="p-0.5 rounded hover:bg-black/10"
                >
                  ✕
                </button>
              </div>
            </div>

              <button
                onClick={() => setSidebarOpen(!sidebarOpen)}
                className="p-2 rounded-xl hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-600 dark:text-neutral-300 transition"

                    <div className="truncate">

                  <button

                    className="text-xs text-neutral-400 hover:text-neutral-600 px-2 py-1"

                    Dismiss

                    onOpenVoiceRecorder={() => setIsVoiceRecorderOpen(true)}
                    onOpenDrawingModal={(cb) => { setDrawingCallback(() => cb); setIsDrawingModalOpen(true); }}
                    isDarkMode={isDarkMode}
                    labels={labels}
                    onOpenZen={(t, c, cb) => setZenModalData({ title: t, content: c, onSave: cb })}
                  />
                </div>

              {/* Sort & View Options Toolbar */}
              <div className="flex items-center justify-between pb-4 border-b border-neutral-200/60 dark:border-neutral-800/80 mb-6 gap-3 flex-wrap">

                  <button
                    onClick={() => { setIsSelectMode(!isSelectMode); setSelectedNoteIds([]); }}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${isSelectMode ? 'bg-amber-500 text-white' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300'}`}
                  >
                    {isSelectMode ? 'Cancel Select' : 'Select'}
                  </button>

                  <div className="flex items-center gap-1 bg-neutral-100 dark:bg-neutral-800 p-0.5 rounded-xl text-xs">
                    <button
                      onClick={() => setViewMode('grid')}
                      className={`p-1.5 rounded-lg transition ${viewMode === 'grid' ? 'bg-white dark:bg-neutral-700 shadow-sm text-amber-500' : 'text-neutral-400'}`}
                      title="Grid View"
                    >
                      <Icons.Grid className="w-3.5 h-3.5" />
                    </button>
                    <button
                      onClick={() => setViewMode('list')}
                      className={`p-1.5 rounded-lg transition ${viewMode === 'list' ? 'bg-white dark:bg-neutral-700 shadow-sm text-amber-500' : 'text-neutral-400'}`}
                      title="List View"
                    >
                      <Icons.List className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-xs text-neutral-400">Sort by:</span>
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="text-xs font-semibold bg-neutral-100 dark:bg-neutral-800 border-none px-3 py-1.5 rounded-xl outline-none cursor-pointer"
                  >
                    <option value="updated">Date Updated</option>
                    <option value="created">Date Created</option>
                    <option value="title">Alphabetical</option>
                    <option value="color">Color</option>
                  </select>
                </div>
              </div>

              {/* Note Grid */}
              <div className="space-y-8">
                {pinnedNotes.length > 0 && (
                  <div>
                    <span className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-3 block px-1">
                      Pinned ({pinnedNotes.length})
                    </span>
                    <div className={viewMode === 'grid' ? "columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-4 space-y-4" : "space-y-3"}>
                      {pinnedNotes.map((note) => (
                        <NoteCard
                          key={note.id}
                          note={note}
                          isDark={isDarkMode}
                          viewMode={viewMode}
                          isSelected={selectedNoteIds.includes(note.id)}
                          isSelectMode={isSelectMode}
                          onToggleSelect={() => {
                            setSelectedNoteIds(prev => prev.includes(note.id) ? prev.filter(id => id !== note.id) : [...prev, note.id]);
                          }}
                          onPin={() => handleSaveNote({ ...note, isPinned: !note.isPinned })}
                          onArchive={() => handleArchiveNote(note)}
                          onTrash={() => handleTrashNote(note)}
                          onRestore={() => handleRestoreNote(note)}
                          onDeletePermanent={async () => {
                            await dbDeleteNotePermanently(note.id);
                            setNotes(await dbGetAllNotes());
                          }}
                          onChangeColor={(c) => handleSaveNote({ ...note, color: c })}
                          onDuplicate={() => handleSaveNote({ ...note, id: null, title: (note.title || '') + ' (Copy)' })}
                          onShare={() => {
                            const txt = (note.title ? note.title + '\n' : '') + (note.content || '');
                            if (navigator.share) navigator.share({ text: txt }).catch(() => {});
                            else {
                              navigator.clipboard?.writeText(txt);
                              alert('Note text copied to clipboard!');
                            }
                          }}
                          onToggleChecklist={() => {
                            if (note.type === 'checklist') {
                              handleSaveNote({ ...note, type: 'text', content: (note.checklist || []).map(i => i.text).join('\n'), checklist: [] });
                            } else {
                              const items = (note.content || '').split('\n').filter(Boolean).map((t, idx) => ({ id: 'it_' + idx, text: t, checked: false }));
                              handleSaveNote({ ...note, type: 'checklist', checklist: items, content: '' });
                            }
                          }}
                          onSetReminder={(r) => handleSaveNote({ ...note, reminder: r })}
                          onOpenLightbox={setLightboxImage}
                          onOpenDrawingModal={(cb) => { setDrawingCallback(() => cb); setIsDrawingModalOpen(true); }}
                          labels={labels}
                          onToggleNoteLabel={(lbl) => {
                            const cur = note.tags || [];
                            const next = cur.includes(lbl) ? cur.filter(t => t !== lbl) : [...cur, lbl];
                            handleSaveNote({ ...note, tags: next });
                          }}
                          onSetMood={(m) => handleSaveNote({ ...note, mood: m })}
                          onUpdateNote={handleSaveNote}
                          isTrashView={currentView === 'trash'}
                        />
                      ))}
                    </div>
                  </div>
                )}

                {otherNotes.length > 0 && (
                  <div>
                    {pinnedNotes.length > 0 && (
                      <span className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-3 block px-1">
                        Others
                      </span>
                    )}
                    <div className={viewMode === 'grid' ? "columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-4 space-y-4" : "space-y-3"}>
                      {otherNotes.map((note) => (
                        <NoteCard
                          key={note.id}
                          note={note}
                          isDark={isDarkMode}
                          viewMode={viewMode}
                          isSelected={selectedNoteIds.includes(note.id)}
                          isSelectMode={isSelectMode}
                          onToggleSelect={() => {
                            setSelectedNoteIds(prev => prev.includes(note.id) ? prev.filter(id => id !== note.id) : [...prev, note.id]);
                          }}
                          onPin={() => handleSaveNote({ ...note, isPinned: !note.isPinned })}
                          onArchive={() => handleArchiveNote(note)}
                          onTrash={() => handleTrashNote(note)}
                          onRestore={() => handleRestoreNote(note)}
                          onDeletePermanent={async () => {
                            await dbDeleteNotePermanently(note.id);
                            setNotes(await dbGetAllNotes());
                          }}
                          onChangeColor={(c) => handleSaveNote({ ...note, color: c })}
                          onDuplicate={() => handleSaveNote({ ...note, id: null, title: (note.title || '') + ' (Copy)' })}
                          onShare={() => {
                            const txt = (note.title ? note.title + '\n' : '') + (note.content || '');
                            if (navigator.share) navigator.share({ text: txt }).catch(() => {});
                            else {
                              navigator.clipboard?.writeText(txt);
                              alert('Note text copied to clipboard!');
                            }

                          onToggleChecklist={() => {
                            if (note.type === 'checklist') {
                              handleSaveNote({ ...note, type: 'text', content: (note.checklist || []).map(i => i.text).join('\n'), checklist: [] });
                            } else {
                              const items = (note.content || '').split('\n').filter(Boolean).map((t, idx) => ({ id: 'it_' + idx, text: t, checked: false }));
                              handleSaveNote({ ...note, type: 'checklist', checklist: items, content: '' });
                            }
                          }}
                          onSetReminder={(r) => handleSaveNote({ ...note, reminder: r })}
                          onOpenLightbox={setLightboxImage}

                            const next = cur.includes(lbl) ? cur.filter(t => t !== lbl) : [...cur, lbl];

                          onSetMood={(m) => handleSaveNote({ ...note, mood: m })}
                          onUpdateNote={handleSaveNote}

                </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppErrorBoundary>
        <App />
      </AppErrorBoundary>
    );
  </script>
</body>
</html>
