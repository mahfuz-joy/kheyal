  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tailwind.min.css">

  <style>
    :root {
      --accent-color: #ea580c;
      --accent-hover: #c2410c;
      --accent-light: rgba(234, 88, 12, 0.12);
      --accent-ring: rgba(234, 88, 12, 0.35);
      --sat: env(safe-area-inset-top, 28px);
      --sab: env(safe-area-inset-bottom, 16px);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior-y: none;
      padding-top: var(--sat);
    }
    input, textarea {
      user-select: text;
    }
    ::-webkit-scrollbar {
      display: none;
      width: 0px;
      height: 0px;
    }
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.6); }
      70% { box-shadow: 0 0 0 16px rgba(234, 88, 12, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0); }
    }
    .animate-popIn {
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-glowPulse {
      animation: pulseGlow 1.6s infinite;
    }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    .offline-splash {
      position: fixed;
      inset: 0;
      background-color: #121316;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 99999;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .offline-logo-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ea580c, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(234, 88, 12, 0.35);
    }
    .offline-logo-box svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .offline-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
      margin: 0;
    }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-[#121316] text-neutral-900 dark:text-neutral-100 min-h-screen transition-colors duration-200 antialiased">
  <div id="root">
    <div class="offline-splash">
      <div class="offline-logo-box">
        <svg viewBox="0 0 24 24">

          <path d="M15 8L18 11" />
          <path d="M17.5 14.5C19 15.5 19 17.5 17.5 18.5" />
          <path d="M20 12.5C22.5 14.5 22.5 19.5 20 21.5" />
          <circle cx="6" cy="6" r="1.5" fill="#ffffff" />
        </svg>
      </div>
      <p class="offline-text">Starting Kheyal...</p>
    </div>
  </div>

  <script src="js/app.bundle.js"></script>
</body>
</html>
