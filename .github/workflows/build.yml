name: Auto Build APK

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets sharp

      - name: Prepare Web Files & Set Version
        run: |
          mkdir -p www assets
          
          # Release Tag থেকে অটো ভার্সন নেওয়া
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="1.2.8"
          fi
          echo "Building for version: $TAG_VER"

          # HTML এ ভার্সন অটোমেটিক বসানো
          sed -i "s/const APP_VERSION = \".*\";/const APP_VERSION = \"$TAG_VER\";/g" index.html
          cp index.html www/index.html
          
          # ক্রিস্টাল ক্লিয়ার অ্যান্ড্রয়েড আইকন জেনারেশন (অ্যান্ড্রয়েড ১২+ এডাপ্টিভ আইকন ফিক্স)
          cat > assets/make-icon.js << 'EOF'
          const sharp = require('sharp');

          const bgSvg = `<svg width="1024" height="1024"><rect width="1024" height="1024" fill="#ea580c"/></svg>`;

          const fgSvg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <g transform="translate(230, 230) scale(23.5)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5C4 19.5 6 18.5 7.5 17C9 15.5 9.5 13.5 9.5 13.5L16.5 6.5C17.3 5.7 18.7 5.7 19.5 6.5C20.3 7.3 20.3 8.7 19.5 9.5L12.5 16.5C12.5 16.5 10.5 17 9 18.5C7.5 20 6.5 22 6.5 22L4 19.5Z" fill="#ffffff" fill-opacity="0.3"/>
              <path d="M15 8L18 11" stroke-width="2.5" />
              <path d="M17.5 14.5C19 15.5 19 17.5 17.5 18.5" stroke-width="2.5" />
              <path d="M20 12.5C22.5 14.5 22.5 19.5 20 21.5" stroke-width="2.5" />
              <circle cx="6" cy="6" r="1.3" fill="#ffffff" stroke="none"/>
            </g>
          </svg>`;

          Promise.all([
            sharp(Buffer.from(bgSvg)).png().toFile('assets/icon-background.png'),
            sharp(Buffer.from(fgSvg)).png().toFile('assets/icon-foreground.png'),
            sharp(Buffer.from(bgSvg)).composite([{ input: Buffer.from(fgSvg) }]).png().toFile('assets/icon-only.png'),
            sharp({ create: { width: 2732, height: 2732, channels: 4, background: { r: 18, g: 19, b: 22, alpha: 1 } } })
              .composite([{ input: Buffer.from(fgSvg), gravity: 'center' }])
              .png().toFile('assets/splash.png'),
            sharp({ create: { width: 2732, height: 2732, channels: 4, background: { r: 18, g: 19, b: 22, alpha: 1 } } })
              .composite([{ input: Buffer.from(fgSvg), gravity: 'center' }])
              .png().toFile('assets/splash-dark.png')
          ]).then(() => console.log('Assets generated successfully'));
          EOF
          node assets/make-icon.js

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.mahfuzjoy.kheyal",
            "appName": "Kheyal",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Update Native Android Version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="1.2.8"
          fi
          # এই স্টেপটি শাওমি ও অ্যান্ড্রয়েড প্যাকেজ ম্যানেজারে 1.0 এর জায়গায় তোমার আসল ভার্সন বসিয়ে দেবে
          sed -i "s/versionName \".*\"/versionName \"$TAG_VER\"/g" android/app/build.gradle

      - name: Generate Native App Icons & Splash
        run: |
          npx @capacitor/assets generate --android

      - name: Sync Web Files
        run: |
          npx cap sync android

      - name: Fix Duplicate Kotlin Classes
        run: |
          cat >> android/build.gradle << 'EOF'
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin') {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kheyal.apk

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: kheyal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kheyal.apk
          path: kheyal.apk
